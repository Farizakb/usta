[project]
name = "usta"
version = "0.1.0"
description = "Cowork-style work agent with its own harness: loop, tools, MCP, sandbox, evals"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "anthropic>=1,<2",
    "asyncpg>=0.30,<1",
    "jsonschema>=4.23,<5",
    "lingua-language-detector>=2.1,<3",
    "litellm==1.104.2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
]

[project.scripts]
usta = "usta.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "openpyxl>=3.1,<4",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["usta"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # ruff >=0.16 formats Markdown; docs are not ruff's job

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # line length is the formatter's job

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live and not sandbox'"
markers = [
    "pg: needs Postgres (USTA_TEST_DATABASE_URL)",
    "live: calls a real model provider and spends quota; run with -m live",
    "sandbox: needs Docker, gVisor (USTA_TEST_SANDBOX_RUNTIME, default runsc) and the usta-sandbox:1 image; run with -m sandbox",
]

[tool.importlinter]
root_package = "usta"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers (P5): core <- ports <- libs <- adapters/engine/tools/store/worker <- app <- cli"
type = "layers"
layers = [
    "usta.cli",
    "usta.app",
    "usta.engines | usta.models | usta.tools | usta.store | usta.worker | usta.sandbox | usta.verify",
    "usta.lang | usta.skills",
    "usta.ports",
    "usta.core",
]

[[tool.importlinter.contracts]]
name = "LiteLLM only in its adapter (F8, ADR-020)"
type = "forbidden"
source_modules = ["usta"]
forbidden_modules = ["litellm"]
allow_indirect_imports = true
ignore_imports = ["usta.models.litellm_adapter -> litellm"]

[[tool.importlinter.contracts]]
name = "Anthropic SDK only in its adapter (ADR-020)"
type = "forbidden"
source_modules = ["usta"]
forbidden_modules = ["anthropic"]
allow_indirect_imports = true
ignore_imports = ["usta.models.anthropic_adapter -> anthropic"]

[[tool.importlinter.contracts]]
name = "Adapters are independent (P5)"
type = "independence"
modules = [
    "usta.models.anthropic_adapter",
    "usta.models.litellm_adapter",
    "usta.models.fake",
]
